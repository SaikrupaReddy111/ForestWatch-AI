# ForestWatch AI: Study Regions Configuration
# Supports multi-region tropical forest monitoring.
# Additional regions can be added here without modifying the codebase.

regions:
  amazon_brazil:
    region_id: "amazon_brazil"
    name: "Amazon Rainforest (Rondônia Hotspot)"
    continent: "South America"
    country: "Brazil"
    # [west, south, east, north] in EPSG:4326 (WGS84)
    bbox: [-62.80, -10.20, -62.00, -9.60]
    dry_season:
      start_month: 7
      start_day: 15
      end_month: 9
      end_day: 15
    target_years:
      t1: 2020
      t2: 2023
    projected_utm_crs: "EPSG:32720" # WGS 84 / UTM zone 20S
    equal_area_crs: "ESRI:54034"   # World Cylindrical Equal Area or regional equal area
    notes: >
      Primary tropical rainforest subject to intense frontier clearing for cattle ranching
      and road expansion (fishbone deforestation patterns).

  congo_basin:
    region_id: "congo_basin"
    name: "Congo Basin (Mai-Ndombe / Salonga)"
    continent: "Central Africa"
    country: "Democratic Republic of the Congo"
    bbox: [18.50, -2.50, 19.30, -1.70]
    dry_season:
      start_month: 6
      start_day: 15
      end_month: 8
      end_day: 15
    target_years:
      t1: 2020
      t2: 2023
    projected_utm_crs: "EPSG:32733" # WGS 84 / UTM zone 33S
    equal_area_crs: "ESRI:54034"
    notes: >
      Dense humid evergreen lowland forest facing clearing from artisanal logging,
      charcoal production, and shifting slash-and-burn agriculture.

  southeast_asia_kalimantan:
    region_id: "southeast_asia_kalimantan"
    name: "Southeast Asian Tropical Forest (Central Kalimantan)"
    continent: "Asia"
    country: "Indonesia"
    bbox: [113.10, -2.40, 113.90, -1.60]
    dry_season:
      start_month: 7
      start_day: 15
      end_month: 9
      end_day: 15
    target_years:
      t1: 2020
      t2: 2023
    projected_utm_crs: "EPSG:32749" # WGS 84 / UTM zone 49S
    equal_area_crs: "ESRI:54034"
    notes: >
      Tropical peat swamp and dipterocarp rainforest under pressure from oil palm
      plantation establishment, canal drainage, and peatland fires.
